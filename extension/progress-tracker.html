<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>JobPilot - Auto-Apply Progress</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    
    h1 {
      font-size: 28px;
      margin-bottom: 8px;
      color: #2d3748;
    }
    
    .subtitle {
      color: #718096;
      margin-bottom: 32px;
    }
    
    .platform {
      background: #f7fafc;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      border-left: 4px solid #cbd5e0;
    }
    
    .platform.active {
      border-left-color: #667eea;
      background: #edf2f7;
    }
    
    .platform.completed {
      border-left-color: #48bb78;
      opacity: 0.7;
    }
    
    .platform-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    
    .platform-name {
      font-size: 18px;
      font-weight: 600;
      color: #2d3748;
    }
    
    .platform-status {
      font-size: 14px;
      padding: 4px 12px;
      border-radius: 12px;
      font-weight: 600;
    }
    
    .status-pending {
      background: #e2e8f0;
      color: #4a5568;
    }
    
    .status-active {
      background: #bee3f8;
      color: #2c5282;
    }
    
    .status-completed {
      background: #c6f6d5;
      color: #22543d;
    }
    
    .progress-bar {
      height: 8px;
      background: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      transition: width 0.5s ease;
    }
    
    .progress-text {
      font-size: 13px;
      color: #718096;
    }
    
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin: 32px 0;
    }
    
    .stat {
      text-align: center;
      padding: 16px;
      background: #f7fafc;
      border-radius: 12px;
    }
    
    .stat-number {
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .stat-label {
      font-size: 12px;
      color: #718096;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }
    
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 32px;
    }
    
    .btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-pause {
      background: #fbbf24;
      color: white;
    }
    
    .btn-stop {
      background: #ef4444;
      color: white;
    }
    
    .btn-close {
      background: #cbd5e0;
      color: #2d3748;
    }
    
    .log {
      margin-top: 24px;
      max-height: 200px;
      overflow-y: auto;
      background: #f7fafc;
      border-radius: 8px;
      padding: 12px;
      font-size: 12px;
      font-family: monospace;
    }
    
    .log-entry {
      padding: 4px 0;
      color: #4a5568;
    }
    
    .log-entry.success {
      color: #22543d;
    }
    
    .log-entry.error {
      color: #742a2a;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎯 Auto-Apply Progress</h1>
    <p class="subtitle">Applying to jobs across multiple platforms...</p>
    
    <div class="stats">
      <div class="stat">
        <div class="stat-number" id="total-applied">0</div>
        <div class="stat-label">Total Applied</div>
      </div>
      <div class="stat">
        <div class="stat-number" id="current-platform-count">0</div>
        <div class="stat-label">This Platform</div>
      </div>
      <div class="stat">
        <div class="stat-number" id="success-rate">0%</div>
        <div class="stat-label">Success Rate</div>
      </div>
    </div>
    
    <div id="platforms-container"></div>
    
    <div class="actions">
      <button id="pause-btn" class="btn btn-pause">⏸ Pause</button>
      <button id="stop-btn" class="btn btn-stop">⏹ Stop</button>
      <button id="close-btn" class="btn btn-close">Close Window</button>
    </div>
    
    <div class="log" id="activity-log">
      <div class="log-entry">Starting auto-apply...</div>
    </div>
  </div>
  
  <script src="progress-tracker.js"></script>
</body>
</html>
